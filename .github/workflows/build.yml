name: Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Check documentation image aspect ratios
        run: npm run check:images

      - name: Run build
        run: npm run build
